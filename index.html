<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI 트립 플래너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Leaflet 지도 라이브러리 (API 키 불필요) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f1f5f9;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 지도 커스텀 번호 핀 */
    .route-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      color: #ffffff;
      font-weight: 800;
      font-size: 12px;
      border: 2.5px solid #ffffff;
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.35);
    }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      font-family: 'Pretendard', sans-serif;
    }
    .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <div class="max-w-md mx-auto min-h-screen bg-white shadow-sm flex flex-col pb-14">
    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 px-5 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center font-bold text-base shadow-sm">✈</span>
        <div>
          <h1 class="text-base font-extrabold text-slate-900 leading-tight">AI 트립 플래너</h1>
          <p class="text-[11px] text-slate-400">경로 지도 · 맞춤 코스 생성</p>
        </div>
      </div>
      <span id="statusBadge" class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500">
        입력 대기
      </span>
    </header>

    <main class="px-5 pt-5 space-y-6 flex-1">
      <!-- 입력 카드 영역 -->
      <section class="space-y-5 bg-slate-50/90 p-4 rounded-3xl border border-slate-200/70">
        <!-- 1. 어디로 떠나시나요? (국내 / 해외 전환) -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-xs font-extrabold text-slate-800">어디로 떠나시나요?</label>
            <span id="selectedDestBadge" class="text-[11px] font-bold text-blue-600 bg-blue-50 border border-blue-200 px-2.5 py-0.5 rounded-full">
              강원특별자치도 강릉시
            </span>
          </div>

          <!-- 국내 / 해외 세그먼트 버튼 -->
          <div class="grid grid-cols-2 gap-1.5 p-1 rounded-2xl bg-slate-200/70">
            <button
              type="button"
              id="btnScopeDomestic"
              onclick="switchTravelScope('domestic')"
              class="
