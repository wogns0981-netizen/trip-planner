<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI 트립 플래너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f1f5f9;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .route-pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      color: #ffffff;
      font-weight: 800;
      font-size: 12px;
      border: 2.5px solid #ffffff;
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.35);
    }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      font-family: 'Pretendard', sans-serif;
    }
    .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <div class="max-w-md mx-auto min-h-screen bg-white shadow-sm flex flex-col pb-14">
    <!-- 상단 헤더 -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-100 px-5 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white flex items-center justify-center shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </span>
        <div>
          <h1 class="text-base font-extrabold text-slate-900 leading-tight">AI 트립 플래너</h1>
          <p class="text-[11px] text-slate-400">경로 지도 · 맞춤 코스 생성</p>
        </div>
      </div>
      <span id="statusBadge" class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500">
        준비 완료
      </span>
    </header>

    <main class="px-5 pt-5 space-y-6 flex-1">
      <!-- 입력 폼 카드 -->
      <section class="space-y-5 bg-slate-50/90 p-4 rounded-3xl border border-slate-200/70">
        <!-- 1. 어디로 떠나시나요? (국내 / 해외 선택) -->
        <div class="space-y-3">
          <div class="flex items-center justify-between gap-2">
            <label class="text-xs font-extrabold text-slate-800">어디로 떠나시나요?</label>
            <span id="selectedDestBadge" class="text-[11px] font-bold text-blue-600 bg-blue-50 border border-blue-200 px-2.5 py-0.5 rounded-full">
              강원특별자치도 강릉시
            </span>
          </div>

          <!-- 국내 / 해외 전환 버튼 -->
          <div class="grid grid-cols-2 gap-1.5 p-1 rounded-2xl bg-slate-200/70">
            <button
              type="button"
              id="btnScopeDomestic"
              onclick="switchTravelScope('domestic')"
              class="py-2.5 rounded-xl text-xs font-extrabold bg-white text-blue-600 shadow-sm transition flex items-center justify-center gap-1.5"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>국내 여행</span>
            </button>
            <button
              type="button"
              id="btnScopeOverseas"
              onclick="switchTravelScope('overseas')"
              class="py-2.5 rounded-xl text-xs font-bold text-slate-600 transition flex items-center justify-center gap-1.5"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span>해외 여행</span>
            </button>
          </div>

          <!-- [국내] 모든 특별시·광역시·자치도 -> '시' 단위만 표시 -->
          <div id="domesticSelector" class="space-y-2.5">
            <div>
              <p class="text-[11px] font-bold text-slate-500 mb-1.5">1단계 · 특별시 / 광역시 / 자치도 (17개 전체)</p>
              <div id="provinceGrid" class="flex flex-wrap gap-1.5"></div>
            </div>
            <div class="rounded-2xl bg-white border border-slate-200/80 p-3">
              <div class="flex items-center justify-between mb-2">
                <p class="text-[11px] font-bold text-slate-700">2단계 · 행정구역 (시 단위)</p>
                <span id="cityCountLabel" class="text-[10px] text-slate-400"></span>
              </div>
              <div id="cityGrid" class="flex flex-wrap gap-1.5"></div>
            </div>
          </div>

          <!-- [해외] 대륙 분류 -> 해당 대륙 국가 표시 -->
          <div id="overseasSelector" class="hidden space-y-2.5">
            <div>
              <p class="text-[11px] font-bold text-slate-500 mb-1.5">1단계 · 대륙 선택</p>
              <div id="continentGrid" class="flex flex-wrap gap-1.5"></div>
            </div>
            <div class="rounded-2xl bg-white border border-slate-200/80 p-3">
              <div class="flex items-center justify-between mb-2">
                <p class="text-[11px] font-bold text-slate-700">2단계 · 국가 선택</p>
                <span id="countryCountLabel" class="text-[10px] text-slate-400"></span>
              </div>
              <div id="countryGrid" class="flex flex-wrap gap-1.5"></div>
            </div>
          </div>
        </div>

        <!-- 2. 여행 기간 (장기간 여행하기 입력 포함) -->
        <div class="space-y-2">
          <label class="block text-xs font-extrabold text-slate-800">여행 기간</label>
          <div id="durationGroup" class="grid grid-cols-3 gap-2">
            <button type="button" data-value="당일치기" class="chip-btn py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">당일치기</button>
            <button type="button" data-value="1박 2일" class="chip-btn py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">1박 2일</button>
            <button type="button" data-value="2박 3일" class="chip-btn active py-2.5 rounded-xl text-xs font-semibold border border-blue-600 bg-blue-600 text-white transition">2박 3일</button>
            <button type="button" data-value="3박 4일" class="chip-btn py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">3박 4일</button>
            <button type="button" data-value="CUSTOM_LONG" class="chip-btn col-span-2 py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">+ 장기간 여행하기</button>
          </div>

          <!-- 장기간 여행하기 직접 입력 칸 -->
          <div id="longTripBox" class="hidden rounded-2xl bg-white border border-blue-200 p-3 space-y-2">
            <p class="text-[11px] font-bold text-blue-700">원하는 숙박 일수(몇 박 몇 일)를 입력해 주세요</p>
            <div class="flex items-center gap-2">
              <div class="flex-1 flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <input
                  id="customNights"
                  type="number"
                  min="4"
                  max="30"
                  value="5"
                  oninput="syncLongTripDays()"
                  class="w-full bg-transparent text-sm font-extrabold text-slate-900 focus:outline-none text-center"
                />
                <span class="text-xs font-bold text-slate-500 ml-1 shrink-0">박</span>
              </div>
              <div class="flex-1 flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                <input
                  id="customDays"
                  type="number"
                  min="5"
                  max="31"
                  value="6"
                  oninput="updateLongTripPreview()"
                  class="w-full bg-transparent text-sm font-extrabold text-slate-900 focus:outline-none text-center"
                />
                <span class="text-xs font-bold text-slate-500 ml-1 shrink-0">일</span>
              </div>
            </div>
            <p id="longTripPreview" class="text-[11px] text-slate-500 text-right">총 5박 6일 일정으로 생성됩니다</p>
          </div>
        </div>

        <!-- 3. 누구와 함께하나요? -->
        <div>
          <label class="block text-xs font-extrabold text-slate-800 mb-1.5">누구와 함께하나요?</label>
          <div id="companionGroup" class="grid grid-cols-3 gap-2">
            <button type="button" data-value="혼자" class="chip-btn py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">혼자</button>
            <button type="button" data-value="연인과" class="chip-btn py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">연인과</button>
            <button type="button" data-value="친구와" class="chip-btn active py-2.5 rounded-xl text-xs font-semibold border border-blue-600 bg-blue-600 text-white transition">친구와</button>
            <button type="button" data-value="가족과" class="chip-btn py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">가족과</button>
            <button type="button" data-value="부모님과" class="chip-btn py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">부모님과</button>
            <button type="button" data-value="아이와" class="chip-btn py-2.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">아이와</button>
          </div>
        </div>

        <!-- 4. 관심사 (복수 선택) -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-extrabold text-slate-800">관심사 (중복 선택)</label>
            <span class="text-[11px] text-slate-400">최소 1개 선택</span>
          </div>
          <div id="interestGroup" class="flex flex-wrap gap-1.5">
            <button type="button" data-value="로컬 맛집" class="multi-chip active px-3 py-2 rounded-xl text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition">로컬 맛집</button>
            <button type="button" data-value="감성 카페" class="multi-chip active px-3 py-2 rounded-xl text-xs font-semibold border border-blue-600 bg-blue-50 text-blue-700 transition">감성 카페</button>
            <button type="button" data-value="자연·풍경" class="multi-chip px-3 py-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">자연·풍경</button>
            <button type="button" data-value="액티비티" class="multi-chip px-3 py-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">액티비티</button>
            <button type="button" data-value="역사·문화" class="multi-chip px-3 py-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">역사·문화</button>
            <button type="button" data-value="힐링·휴식" class="multi-chip px-3 py-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">힐링·휴식</button>
            <button type="button" data-value="쇼핑·야시장" class="multi-chip px-3 py-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 transition">쇼핑·야시장</button>
          </div>
        </div>

        <!-- 일정 생성 버튼 -->
        <button
          id="generateBtn"
          type="button"
          onclick="generatePlan()"
          class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-[0.99] text-white font-extrabold text-sm shadow-md shadow-blue-600/20 transition flex items-center justify-center gap-2"
        >
          <span>경로 지도 & 맞춤 일정 만들기</span>
        </button>
      </section>

      <!-- 서버 거절 / 오류 알림 -->
      <section id="errorBox" class="hidden rounded-2xl bg-rose-50 border border-rose-200 p-4 text-rose-800">
        <div class="space-y-1">
          <p class="text-xs font-bold text-rose-900">일정을 생성할 수 없습니다</p>
          <p id="errorText" class="text-xs text-rose-700 leading-relaxed"></p>
        </div>
      </section>

      <!-- 로딩 스켈레톤 -->
      <section id="loadingBox" class="hidden space-y-3">
        <div class="h-24 rounded-2xl bg-slate-100 animate-pulse"></div>
        <div class="h-56 rounded-2xl bg-slate-100 animate-pulse"></div>
        <div class="h-32 rounded-2xl bg-slate-100 animate-pulse"></div>
      </section>

      <!-- 결과 영역 -->
      <section id="resultSection" class="hidden space-y-4">
        <!-- 요약 배너 -->
        <div class="rounded-3xl bg-gradient-to-br from-slate-900 via-blue-950 to-indigo-950 text-white p-4 shadow-sm">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span id="resultMeta" class="text-[11px] font-semibold bg-white/15 px-2.5 py-0.5 rounded-full"></span>
            <button
              type="button"
              onclick="copyItineraryText()"
              id="copyBtn"
              class="text-[11px] font-bold bg-white text-slate-900 px-2.5 py-1 rounded-lg active:scale-95 transition"
            >
              일정 복사
            </button>
          </div>
          <h2 id="resultTitle" class="text-lg font-extrabold tracking-tight mb-1"></h2>
          <p id="resultSummary" class="text-xs text-blue-100/90 leading-relaxed"></p>
        </div>

        <!-- 영업시간·요금 사전 확인 안내 -->
        <div id="noticeBox" class="rounded-2xl bg-amber-50 border border-amber-200/80 px-3.5 py-2.5">
          <p id="resultNotice" class="text-[11px] text-amber-900 leading-relaxed"></p>
        </div>

        <!-- 일차 필터 탭 -->
        <div id="dayTabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-0.5"></div>

        <!-- 방문 경로 지도 카드 -->
        <div id="mapCard" class="rounded-3xl border border-slate-200/90 bg-white overflow-hidden shadow-sm">
          <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-600"></span>
              <span class="text-xs font-extrabold text-slate-800">방문 동선 지도</span>
            </div>
            <span id="mapRouteLabel" class="text-[11px] font-semibold text-blue-600">전체 경로</span>
          </div>
          <div id="routeMap" class="w-full h-60 z-10"></div>
          <div id="routeLegend" class="px-3.5 py-2 bg-slate-50/70 border-t border-slate-100 flex items-center gap-1.5 overflow-x-auto no-scrollbar text-[11px] text-slate-600"></div>
        </div>

        <!-- 일차별 카드 목록 -->
        <div id="daysContainer" class="space-y-6 pt-1"></div>
      </section>
    </main>
  </div>

  <script>
    // 1. 국내 행정구역 데이터 (모든 특별시·광역시·자치도 -> '시' 단위만 포함)
    const KOREA_REGIONS = {
      '서울특별시': ['서울특별시'],
      '부산광역시': ['부산광역시'],
      '대구광역시': ['대구광역시'],
      '인천광역시': ['인천광역시'],
      '광주광역시': ['광주광역시'],
      '대전광역시': ['대전광역시'],
      '울산광역시': ['울산광역시'],
      '세종특별자치시': ['세종특별자치시'],
      '경기도': [
        '수원시', '성남시', '고양시', '용인시', '부천시', '안산시', '안양시',
        '남양주시', '화성시', '평택시', '의정부시', '시흥시', '파주시', '광명시',
        '김포시', '군포시', '광주시', '이천시', '양주시', '오산시', '구리시',
        '안성시', '포천시', '의왕시', '하남시', '여주시', '동두천시', '과천시'
      ],
      '강원특별자치도': ['춘천시', '원주시', '강릉시', '동해시', '태백시', '속초시', '삼척시'],
      '충청북도': ['청주시', '충주시', '제천시'],
      '충청남도': ['천안시', '공주시', '보령시', '아산시', '서산시', '논산시', '계룡시', '당진시'],
      '전북특별자치도': ['전주시', '군산시', '익산시', '정읍시', '남원시', '김제시'],
      '전라남도': ['목포시', '여수시', '순천시', '나주시', '광양시'],
      '경상북도': ['포항시', '경주시', '김천시', '안동시', '구미시', '영주시', '영천시', '상주시', '문경시', '경산시'],
      '경상남도': ['창원시', '진주시', '통영시', '사천시', '김해시', '밀양시', '거제시', '양산시'],
      '제주특별자치도': ['제주시', '서귀포시']
    };

    // 2. 해외 대륙별 국가 데이터
    const OVERSEAS_CONTINENTS = {
      '아시아': ['일본', '베트남', '태국', '대만', '필리핀', '싱가포르', '인도네시아', '말레이시아', '홍콩·마카오', '라오스'],
      '유럽': ['프랑스', '이탈리아', '스페인', '영국', '스위스', '독일', '체코', '오스트리아', '포르투갈', '그리스', '크로아티아'],
      '북미': ['미국', '캐나다', '멕시코'],
      '남미': ['페루', '브라질', '아르헨티나', '칠레', '볼리비아', '콜롬비아'],
      '중동': ['아랍에미리트(두바이)', '튀르키예', '카타르', '요르단', '오만', '사우디아라비아'],
      '오세아니아': ['호주', '뉴질랜드', '괌·사이판']
    };

    // 주요 지역 기준 좌표
    const BASE_COORDS = {
      '서울특별시': [37.5665, 126.9780],

    function initSingleSelect(groupId, onChange) {
      const group = document.getElementById(groupId);
      group.addEventListener('click', (e) => {
        const btn = e.target.closest('.chip-btn');
        if (!btn) return;
        group.querySelectorAll('.chip-btn').forEach((b) => {
          b.classList.remove('active', 'border-blue-600', 'bg-blue-600', 'text-white');
          b.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
        });
        btn.classList.add('active', 'border-blue-600', 'bg-blue-600', 'text-white');
        btn.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
        if (onChange) onChange(btn.dataset.value);
      });
    }

    function initMultiSelect(groupId) {
      const group = document.getElementById(groupId);
      group.addEventListener('click', (e) => {
        const btn = e.target.closest('.multi-chip');
        if (!btn) return;
        const activeCount = group.querySelectorAll('.multi-chip.active').length;
        if (btn.classList.contains('active') && activeCount === 1) return;

        btn.classList.toggle('active');
        if (btn.classList.contains('active')) {
          btn.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
          btn.classList.add('border-blue-600', 'bg-blue-50', 'text-blue-700');
        } else {
          btn.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
          btn.classList.remove('border-blue-600', 'bg-blue-50', 'text-blue-700');
        }
      });
    }

    function parseDayCount(duration) {
      if (duration.includes('당일')) return 1;
      const match = duration.match(/(\d+)\s*일/);
      return match ? Math.min(Math.max(parseInt(match[1], 10), 1), 14) : 3;
    }

    function attachCoordinates(plan) {
      const key = getBaseCoordinateKey();
      const [baseLat, baseLng] = BASE_COORDS[key] || [37.5665, 126.9780];
      const routeOffsets = [
        [0.000, 0.000],
        [0.014, 0.018],
        [0.026, 0.008],
        [0.018, -0.016],
        [-0.012, -0.022],
        [-0.024, 0.010],
        [-0.008, 0.028]
      ];

      let globalIdx = 0;
      (plan.days || []).forEach((d, dayIdx) => {
        (d.items || []).forEach((item) => {
          if (typeof item.lat !== 'number' || typeof item.lng !== 'number') {
            const [dLat, dLng] = routeOffsets[globalIdx % routeOffsets.length];
            const dayShift = dayIdx * 0.009;
            item.lat = Number((baseLat + dLat + dayShift).toFixed(5));
            item.lng = Number((baseLng + dLng - dayShift * 0.6).toFixed(5));
          }
          globalIdx++;
        });
      });
      return plan;
    }

              place: `${shortPlace} 골목 인기 다이닝`,
              category: '맛집',
              description: '정갈한 한 끼 식사와 깔끔한 분위기로 만족도가 높은 점심 코스입니다.',
              tip: '브레이크 타임 유무는 방문 전 지도 앱에서 확인하세요.'
            },
            {
              time: '15:30',
              place: `${shortPlace} 문화 전시 · 소품 거리`,
              category: '관광',
              description: '지역 감성이 담긴 소품숍과 전시 공간을 구경하며 기념품을 고르기 좋습니다.',
              tip: '매장별 휴무일이 다를 수 있으니 방문 전 확인을 권장합니다.'
            }
          ]
        },
        {
          theme: `여유로운 브런치와 기념품 마무리`,
          items: [
            {
              time: '10:30',
              place: `${shortPlace} 베이커리 브런치 카페`,
              category: '카페',
              description: '여유롭게 아침 겸 점심을 즐길 수 있는 감성 베이커리 카페입니다.',
              tip: '인기 메뉴는 조기 품절될 수 있습니다.'
            },
            {
              time: '13:00',
              place: `${shortPlace} 전통시장 & 특산물 거리`,
              category: '관광',
              description: '돌아가기 전 지역 특산물과 간단한 주전부리를 챙기기 좋은 마무리 코스입니다.',
              tip: '방문 전 최신 영업시간 및 주차 안내를 확인하세요.'
            }
          ]
        }
      ];

      const days = Array.from({ length: totalDays }, (_, idx) => {
        const tpl = templates[idx % templates.length];
        return {
          day: idx + 1,
          theme: tpl.theme,
          items: tpl.items.map((it) => ({ ...it }))
        };
      });

      return attachCoordinates({
        destination,
        duration,
        companion,
        summary: `${companion} 떠나는 ${destination} ${duration} 여행! '${interestText}' 취향을 반영해 이동 동선이 겹치지 않도록 구성한 예시 일정입니다.`,
        notice: '실제 방문 전 각 장소의 공식 홈페이지나 지도 앱에서 최신 영업시간, 휴무일 및 요금을 반드시 확인하세요.',
        days
      });
    }

    async function generatePlan() {
      const payload = getFormValues();
      const btn = document.getElementById('generateBtn');
      const loadingBox = document.getElementById('loadingBox');
      const resultSection = document.getElementById('resultSection');
      const errorBox = document.getElementById('errorBox');
      const statusBadge = document.getElementById('statusBadge');

      btn.disabled = true;
      btn.classList.add('opacity-60');
      errorBox.classList.add('hidden');
      resultSection.classList.add('hidden');
      loadingBox.classList.remove('hidden');
      statusBadge.textContent = '일정 생성 중...';
      statusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600';

      try {
        const res = await fetch('/api/plan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.status === 404) {
          throw new Error('ENDPOINT_NOT_FOUND');
        }

        const data = await res.json();

        if (!res.ok) {
          loadingBox.classList.add('hidden');
          document.getElementById('errorText').textContent =
            data?.error || '요청을 처리하는 중 오류가 발생했습니다.';
          errorBox.classList.remove('hidden');
          statusBadge.textContent = '요청 안내';
          statusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-rose-50 text-rose-600';
          return;
        }

        currentPlan = attachCoordinates(data);
        selectedDayFilter = 'ALL';

        loadingBox.classList.add('hidden');
        resultSection.classList.remove('hidden');
        renderPlan(currentPlan);

        statusBadge.textContent = 'Gemini AI 생성 완료';
        statusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700';
      } catch (err) {
        await new Promise((r) => setTimeout(r, 350));
        currentPlan = buildFallbackPlan(payload);
        selectedDayFilter = 'ALL';

        loadingBox.classList.add('hidden');
        resultSection.classList.remove('hidden');
        renderPlan(currentPlan);

        statusBadge.textContent = '예시 일정 · /api/plan 미연동';
        statusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700';
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-60');
      }
    }

    function initMapIfNeeded() {
      if (leafletMap || typeof L === 'undefined') return;
      leafletMap = L.map('routeMap', {
        zoomControl: true,
        attributionControl: false
      }).setView([37.7519, 128.8761], 12);

     const osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      });

      const esriFallbackLayer = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 18 }
      );

      let switchedToFallback = false;
      osmLayer.on('tileerror', () => {
        if (!switchedToFallback) {
          switchedToFallback = true;
          leafletMap.removeLayer(osmLayer);
          esriFallbackLayer.addTo(leafletMap);
        }
      });

      osmLayer.addTo(leafletMap);
      
      mapLayerGroup = L.layerGroup().addTo(leafletMap);
    }

    function renderRouteMap(plan) {
      initMapIfNeeded();
      if (!leafletMap || !mapLayerGroup) return;

      mapLayerGroup.clearLayers();
      markerRefs = {};

      const filteredDays =
        selectedDayFilter === 'ALL'
          ? plan.days || []
          : (plan.days || []).filter((d) => String(d.day) === selectedDayFilter);

      document.getElementById('mapRouteLabel').textContent =
        selectedDayFilter === 'ALL' ? `전체 ${plan.days.length}일 경로` : `Day ${selectedDayFilter} 이동 동선`;

      const allBounds = [];
      const legendChips = [];
      let totalOrder = 1;

      filteredDays.forEach((dayObj) => {
        const dayColor = DAY_COLORS[(dayObj.day - 1) % DAY_COLORS.length];
        const dayLatLngs = [];

        (dayObj.items || []).forEach((item, idx) => {
          if (typeof item.lat !== 'number' || typeof item.lng !== 'number') return;
          const pos = [item.lat, item.lng];
          dayLatLngs.push(pos);
          allBounds.push(pos);

          const pinNumber = selectedDayFilter === 'ALL' ? totalOrder : idx + 1;
          const markerKey = `${dayObj.day}-${idx}`;

          const icon = L.divIcon({
            className: '',
            html: `<div class="route-pin" style="background-color:${dayColor}">${pinNumber}</div>`,
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          });

          const marker = L.marker(pos, { icon }).bindPopup(
            `<div class="font-bold text-slate-900">Day ${dayObj.day} · #${pinNumber} ${escapeHtml(item.place)}</div>
             <div class="text-slate-500 mt-0.5">${escapeHtml(item.time)} · ${escapeHtml(item.category)}</div>`
          );

          marker.addTo(mapLayerGroup);
          markerRefs[markerKey] = marker;

          legendChips.push(`
            <button
              type="button"
              onclick="focusMapMarker('${markerKey}')"
              class="shrink-0 inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-white border border-slate-200 hover:border-blue-400 transition"
            >
              <span class="w-4 h-4 rounded-full text-white text-[10px] font-extrabold flex items-center justify-center" style="background:${dayColor}">${pinNumber}</span>
              <span class="font-semibold text-slate-700 max-w-[96px] truncate">${escapeHtml(item.place)}</span>
            </button>
          `);

          totalOrder++;
        });

        if (dayLatLngs.length >= 2) {
          L.polyline(dayLatLngs, {
            color: dayColor,
            weight: 4,
            opacity: 0.85,
            dashArray: '6, 6'
          }).addTo(mapLayerGroup);
        }
      });

      document.getElementById('routeLegend').innerHTML =
        legendChips.join('<span class="text-slate-300">→</span>') || '<span>표시할 경로 좌표가 없습니다.</span>';

      setTimeout(() => {
        leafletMap.invalidateSize();
        if (allBounds.length === 1) {
          leafletMap.setView(allBounds[0], 14);
        } else if (allBounds.length > 1) {
          leafletMap.fitBounds(allBounds, { padding: [32, 32] });
        }
      }, 60);
    }

    function focusMapMarker(markerKey) {
      const marker = markerRefs[markerKey];
      if (!marker || !leafletMap) return;
      document.getElementById('mapCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
      const latLng = marker.getLatLng();
      leafletMap.flyTo(latLng, 15, { duration: 0.6 });
      setTimeout(() => marker.openPopup(), 350);
    }

    function renderPlan(plan) {
      document.getElementById('resultMeta').textContent = `${plan.duration} · ${plan.companion}`;
      document.getElementById('resultTitle').textContent = `${plan.destination} 맞춤 여행 코스`;
      document.getElementById('resultSummary').textContent = plan.summary || '';

      const noticeBox = document.getElementById('noticeBox');
      if (plan.notice) {
        document.getElementById('resultNotice').textContent = plan.notice;
        noticeBox.classList.remove('hidden');
      } else {
        noticeBox.classList.add('hidden');
      }

      renderDayTabs(plan.days || []);
      renderRouteMap(plan);
      renderDayCards(plan);
    }

    function renderDayTabs(days) {
      const tabsEl = document.getElementById('dayTabs');
      const tabItems = [
        { key: 'ALL', label: '전체 경로' },
        ...days.map((d) => ({ key: String(d.day), label: `Day ${d.day}` }))
      ];

      tabsEl.innerHTML = tabItems
        .map((tab) => {
          const isActive = selectedDayFilter === tab.key;
          return `
            <button
              type="button"
              onclick="filterDay('${tab.key}')"
              class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-extrabold transition ${
                isActive
                  ? 'bg-slate-900 text-white shadow-sm'
                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
              }"
            >
              ${tab.label}
            </button>
          `;
        })
        .join('');
    }

    function filterDay(key) {
      selectedDayFilter = key;
      if (!currentPlan) return;
      renderDayTabs(currentPlan.days || []);
      renderRouteMap(currentPlan);
      renderDayCards(currentPlan);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderDayCards(plan) {
      const container = document.getElementById('daysContainer');
      const filteredDays =
        selectedDayFilter === 'ALL'
          ? plan.days || []
          : (plan.days || []).filter((d) => String(d.day) === selectedDayFilter);

      container.innerHTML = filteredDays
        .map((dayObj) => {
          const dayColor = DAY_COLORS[(dayObj.day - 1) % DAY_COLORS.length];
          const itemsHtml = (dayObj.items || [])
            .map((item, index) => {
              const style = CATEGORY_STYLES[item.category] || CATEGORY_STYLES['관광'];
              const thumbSrc = item.thumbnail || buildThumbnailSvg(item.category, dayObj.day * 10 + index);
              const markerKey = `${dayObj.day}-${index}`;

              const mapQuery = encodeURIComponent(`${plan.destination} ${item.place}`);
              const naverMapUrl = `https://map.naver.com/p/search/${mapQuery}`;
              const kakaoMapUrl = `https://map.kakao.com/link/search/${mapQuery}`;
              const isLast = index === dayObj.items.length - 1;

              return `
                <div class="relative pl-7 ${isLast ? '' : 'pb-4'}">
                  ${isLast ? '' : '<div class="absolute left-[10px] top-5 bottom-0 w-[2px] bg-slate-200"></div>'}
                  <div
                    class="absolute left-0 top-1.5 w-[22px] h-[22px] rounded-full text-white text-[11px] font-extrabold flex items-center justify-center shadow-sm"
                    style="background-color:${dayColor}"
                  >
                    ${index + 1}
                  </div>

                  <div class="rounded-2xl bg-white border border-slate-200/90 p-3.5 shadow-sm space-y-2.5">
                    <div class="flex items-start gap-3">
                      <img
                        src="${thumbSrc}"
                        alt="${escapeHtml(item.place)}"
                        class="w-16 h-16 rounded-xl object-cover shrink-0 bg-slate-100 border border-slate-100"
                      />
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-1.5 mb-1">
                          <span class="text-xs font-extrabold text-slate-900">${escapeHtml(item.time)}</span>
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${style.bg} ${style.text} ${style.border}">
                            ${escapeHtml(item.category)}
                          </span>
                        </div>
                        <h4 class="text-sm font-extrabold text-slate-900 leading-snug truncate">${escapeHtml(item.place)}</h4>
                        <p class="text-xs text-slate-600 leading-relaxed mt-1">${escapeHtml(item.description)}</p>
                      </div>
                    </div>

                    <div class="rounded-xl bg-slate-50 px-3 py-2 text-[11px] text-slate-600 leading-relaxed">
                      <span class="font-bold text-blue-600 mr-1">TIP</span>${escapeHtml(item.tip)}
                    </div>

                    <div class="grid grid-cols-3 gap-1.5 pt-0.5">
                      <button
                        type="button"
                        onclick="focusMapMarker('${markerKey}')"
                        class="py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold text-[11px] transition"
                      >
                        경로 핀 보기
                      </button>
                      <a
                        href="${naverMapUrl}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="text-center py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-[11px] transition"
                      >
                        네이버 지도
                      </a>
                      <a
                        href="${kakaoMapUrl}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="text-center py-1.5 rounded-lg bg-yellow-50 hover:bg-yellow-100 text-amber-800 font-bold text-[11px] transition"
                      >
                        카카오맵
                      </a>
                    </div>
                  </div>
                </div>
              `;
            })
            .join('');

          return `
            <div class="space-y-3">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-lg text-white text-xs font-extrabold" style="background-color:${dayColor}">
                  Day ${escapeHtml(dayObj.day)}
                </span>
                <h3 class="text-sm font-extrabold text-slate-900">${escapeHtml(dayObj.theme)}</h3>
              </div>
              <div class="pt-0.5">${itemsHtml}</div>
            </div>
          `;
        })
        .join('');
    }

    async function copyItineraryText() {
      if (!currentPlan) return;
      const lines = [
        `[${currentPlan.destination} ${currentPlan.duration} 여행 일정 (${currentPlan.companion})]`,
        currentPlan.summary,
        ''
      ];

      (currentPlan.days || []).forEach((d) => {
        lines.push(`■ Day ${d.day} - ${d.theme}`);
        (d.items || []).forEach((item, idx) => {
          lines.push(`  ${idx + 1}. ${item.time} [${item.category}] ${item.place}`);
          lines.push(`     - ${item.description}`);
          lines.push(`     - TIP: ${item.tip}`);
        });
        lines.push('');
      });

      if (currentPlan.notice) {
        lines.push(`※ ${currentPlan.notice}`);
      }

      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.textContent = '복사 완료!';
        setTimeout(() => {
          copyBtn.textContent = '일정 복사';
        }, 1800);
      } catch {
        alert('클립보드 복사에 실패했습니다.');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderProvinces();
      renderCities();
      renderContinents();
      renderCountries();
      updateSelectedDestBadge();

      initSingleSelect('durationGroup', (val) => {
        const longBox = document.getElementById('longTripBox');
        if (val === 'CUSTOM_LONG') {
          longBox.classList.remove('hidden');
          updateLongTripPreview();
        } else {
          longBox.classList.add('hidden');
        }
      });
      initSingleSelect('companionGroup');
      initMultiSelect('interestGroup');

      currentPlan = buildFallbackPlan(getFormValues());
      document.getElementById('resultSection').classList.remove('hidden');
      renderPlan(currentPlan);

      const statusBadge = document.getElementById('statusBadge');
      statusBadge.textContent = '예시 일정 · /api/plan 미연동';
      statusBadge.className = 'text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700';
    });
  </script>
